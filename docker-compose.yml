# The "cloud" side: a Qdrant Server that every edge device syncs with.
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: fieldmind-cloud
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
